{% extends 'base.html' %}

{% block title %}
SGE - Deletar Fornecedor
{% endblock %}

{% block content %}

<!-- Page Header -->
<div class="mb-8">
  <h1 class="text-2xl font-bold text-white">Deletar Fornecedor</h1>
</div>

<!-- Confirmation Card -->
<div class="max-w-2xl">
  <div class="bg-gray-900 rounded-xl border border-red-900/50 p-6">
    <!-- Warning Icon -->
    <div class="flex items-center gap-3 mb-6">
      <div class="flex-shrink-0 w-12 h-12 bg-red-600/20 rounded-lg flex items-center justify-center">
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>
      <div>
        <h2 class="text-lg font-semibold text-white">Confirmar Exclusão</h2>
        <p class="text-sm text-gray-400">Esta ação não pode ser desfeita.</p>
      </div>
    </div>

    <!-- Confirmation Message -->
    <div class="bg-red-900/20 border border-red-800/50 rounded-lg p-4 mb-6">
      <p class="text-gray-300">
        Tem certeza de que deseja excluir o fornecedor <strong class="text-white font-semibold">{{ object.name }}</strong>?
      </p>
    </div>

    <!-- Form -->
    <form method="post">
      {% csrf_token %}
      <div class="flex items-center gap-3">
        <button
          type="submit"
          class="bg-red-600 hover:bg-red-700 text-white py-2.5 px-5 rounded-lg font-semibold transition-all duration-200"
        >
          Sim, Deletar Fornecedor
        </button>
        <a
          href="{% url 'supplier_list' %}"
          class="bg-gray-700 hover:bg-gray-600 text-gray-200 py-2.5 px-5 rounded-lg transition-all duration-200"
        >
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
