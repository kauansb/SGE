{# Header bar - Top navigation #}
<header class="bg-gray-900 border-b border-gray-800 h-16 flex items-center justify-between px-6 sticky top-0 z-10">
    {# Left side - Mobile menu button + Logo #}
    <div class="flex items-center gap-4">
        {# Mobile hamburger menu button #}
        {% if user.is_authenticated %}
        <button
            id="mobile-menu-button"
            type="button"
            class="lg:hidden text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded-lg p-2 transition-colors duration-200"
            aria-label="Abrir menu"
        >
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        {% endif %}

        {# Logo/Title #}
        <a href="{% url 'home' %}" class="flex items-center gap-2 group">
            <span class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-violet-500 bg-clip-text text-transparent group-hover:from-indigo-400 group-hover:to-violet-400 transition-all duration-200">
                SGE
            </span>
        </a>
    </div>

    {# Right side - User info #}
    {% if user.is_authenticated %}
    <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 px-3 py-2 bg-gray-800 rounded-lg border border-gray-700">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="text-sm text-gray-300 font-medium">{{ user.username }}</span>
        </div>
    </div>
    {% endif %}
</header>
